<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="lcl-logo-title lcl-logo-description"
>
  <title id="lcl-logo-title">Ludic Core Laboratory</title>
  <desc id="lcl-logo-description">
    Angular LCL letters surrounded by segmented orbital lines and the words Ludic
    Core Lab.
  </desc>

  <g
    id="lcl-wordmark"
    fill="#0d0e12"
    font-family="'Arial Narrow', 'Liberation Sans Narrow', Arial, sans-serif"
    font-size="46"
    font-weight="700"
    text-anchor="middle"
  >
    <text x="230" y="302" transform="rotate(-43 230 302)">L</text>
    <text x="271" y="267" transform="rotate(-36 271 267)">U</text>
    <text x="315" y="239" transform="rotate(-28 315 239)">D</text>
    <text x="357" y="218" transform="rotate(-19 357 218)">I</text>
    <text x="398" y="203" transform="rotate(-12 398 203)">C</text>
    <text x="468" y="189" transform="rotate(-4 468 189)">C</text>
    <text x="518" y="187" transform="rotate(2 518 187)">O</text>
    <text x="570" y="194" transform="rotate(8 570 194)">R</text>
    <text x="620" y="207" transform="rotate(15 620 207)">E</text>
    <text x="686" y="237" transform="rotate(25 686 237)">L</text>
    <text x="732" y="266" transform="rotate(33 732 266)">A</text>
    <text x="774" y="302" transform="rotate(40 774 302)">B</text>
  </g>

  <g
    id="lcl-orbit-outer"
    fill="none"
    stroke="#0d0e12"
    stroke-linecap="butt"
  >
    <path d="M158 382 L207 316" stroke-width="6" />
    <path d="M814 317 Q865 366 889 440" stroke-width="6" />
    <path d="M873 370 Q948 363 931 410 Q920 441 894 465" stroke-width="7" />
    <path d="M862 502 Q813 555 752 587" stroke-width="6" />
    <path d="M786 725 Q744 807 648 850" stroke-width="6" />
    <path d="M612 874 Q560 892 510 893" stroke-width="6" />
    <path d="M236 689 Q273 761 347 802" stroke-width="6" />
  </g>

  <g id="lcl-orbit-dots" fill="#0d0e12">
    <circle cx="879" cy="482" r="14" />
    <circle cx="629" cy="864" r="10" />
    <circle cx="386" cy="823" r="10" />
  </g>

  <g
    id="lcl-orbit-inner"
    fill="none"
    stroke="#0d0e12"
    stroke-linecap="butt"
  >
    <path d="M291 375 Q512 141 733 375" stroke-width="17" />
    <path
      d="M279 689 Q371 838 514 841 Q658 843 748 703"
      stroke-width="16"
    />
    <path d="M278 690 Q310 741 362 773" stroke-width="14" />
    <path d="M407 829 Q505 858 608 829" stroke-width="6" />
  </g>

  <g id="lcl-center" fill="#0d0e12">
    <path d="M214 395 H273 L227 566 L177 609 L148 673 H120 L185 437 Z" />
    <path d="M179 610 H360 L429 700 H407 L386 673 H163 Z" />

    <path
      d="M463 395 H668 L644 449 H482 L452 474 L424 575 L449 610
        H599 L582 673 H407 L371 586 H349 L383 464 Z"
    />

    <path d="M701 395 H760 L706 597 L646 648 L633 657 H608 L676 423 Z" />
    <path d="M707 610 H879 L927 673 H608 L633 658 L646 658 Z" />
  </g>
</svg>
